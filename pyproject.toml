[project]
name = "swarmforge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pytest-asyncio>=1.3.0",
    "uvicorn>=0.46.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

